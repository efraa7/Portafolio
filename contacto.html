<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contacto - Flores Walter Efrain</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <script type="text/javascript" src="emailjs.js"></script>
        <!-- Cargamos EmailJS directamente desde internet -->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/emailjs.min.js"></script>
        <script type="text/javascript">
            emailjs.init({
            publicKey: "jFlhP1c0DrcPu9SMP"
            });
        </script>
        
    </head>

    <body class="body-contacto">
        <div class="modal-contenido">
            <div class="botones-superiores">
                <button id="btn-inicio" class="btn-icono btn-animado" title="Ir al inicio">Inicio</button>
                <button id="btn-cerrar" class="btn-icono btn-animado" title="Cerrar">✖</button>
            </div>
            <img src="imagenes/contacto.png" alt="Foto Walter" class="foto-modal">
            <h2 class="titulo-modal">¿Quieres disctuir una propuesta?</h2>
            <p class="subtitulo-modal">Estoy a disposición.</p>

            <form class="formulario-contacto" id="form-contacto">
                <div class="campo">
                    <label for="nombreyapellido">Nombre y Apellido</label>
                    <input type="text" id="nombreyapellido" name="nombre" placeholder="Juan Perez" required>
                </div>
                <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="JuanPerez@gmail.com" required>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="+54 387 1234567" required>
                </div>

               <div class="campo">
                    <label for="asunto">Asunto</label>
                    <select name="asunto" id="asunto">
                        <option value="consulta">Una consulta</option>
                        <option value="trabajo">Una propuesta de trabajo</option>
                        <option value="otro">Otro motivo</option>
                    </select>
                </div>

                <div class="campo campo-completo radios-medio">
                    <span>¿Cómo preferís que responda?</span>
                    <div class="opciones-radio">
                        <input type="radio" name="medio" id="por-mail" value="mail" checked>
                        <label for="por-mail">Por correo</label>
                    
                        <input type="radio" name="medio" id="por-telefono" value="telefono">
                        <label for="por-telefono">Por teléfono</label>
                    </div>
                </div>

                <div class="campo campo-completo">
                    <label for="mensaje">Detalles adicionales</label>
                    <textarea name="mensaje" id="mensaje" rows="4" placeholder="Escribí tu mensaje acá, pa" required></textarea>
                </div>

                <div class="botones-formulario campo-completo">
                    <button type="submit" class="btn-estilo-menu btn-animado">Enviar mensaje</button>
                    <button type="reset" class="btn-estilo-menu btn-animado">Borrar todo</button>
              </div>
           </form>
        </div>

        <script src="contacto.js"></script>
    </body>
</html>
